name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: node --test scripts/test/

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build index
        run: node scripts/build-index.mjs --site-url "${{ steps.pages.outputs.base_url }}/"

      - name: Assemble site
        # Copy only the web app and published (non-draft) posts; docs/ and scripts/ are not deployed.
        run: |
          mkdir -p _site/posts
          cp -r index.html about.md assets posts.json feed.xml _site/
          for slug in $(node -p "require('./posts.json').posts.map(p => p.slug).join(' ')"); do
            cp -r "posts/$slug" _site/posts/
          done
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
